; iown-ha-bridge: io-homecontrol 1W firmwares for the LilyGO TTGO LoRa32 T3 V1.6.1 (SX1276)
; Build options are taken from upstream iown-homecontrol (extern/iown-homecontrol/platformio.ini).

[platformio]
default_envs = ttgo-lora32-v21-mqtt

[env]
framework       = arduino
platform        = espressif32
board           = ttgo-lora32-v21
board_build.f_cpu = 240000000L
build_unflags   = -std=gnu++11 -Os
build_flags     = -std=gnu++2a -O3
                  -mtarget-align
                  -mlongcalls
                  -DPIO_FRAMEWORK_ARDUINO_NO_USB
                  -I extern/iown-homecontrol/src ; upstream IoHome.h (sync word constants)
                  -DARDUINO_TTGO_LORA32_V21NEW   ; LoRa32 checks this spelling, PlatformIO's board defines ARDUINO_TTGO_LoRa32_v21new
lib_compat_mode = off
lib_deps        = SPI
                  https://github.com/jgromes/RadioLib
                  symlink://extern/LoRa32 ; upstream Velocet/LoRa32 submodule (board pin definitions)
upload_speed    = 921600
monitor_speed   = 115200
monitor_eol     = LF

;   SNIFFER: receive-only io-homecontrol sniffer (src/sniffer.cpp)
[env:ttgo-lora32-v21-sniffer]
build_src_filter = -<*> +<sniffer.cpp>

;   MQTT: Home Assistant integration over WiFi (src/mqtt.cpp)
;   Needs include/iown_net.h (copy from iown_net.example.h) and include/iown_key.h.
[env:ttgo-lora32-v21-mqtt]
build_src_filter = -<*> +<mqtt.cpp>
lib_deps         = ${env.lib_deps}
                   knolleary/PubSubClient @ ^2.8
                   bblanchon/ArduinoJson @ ^7.2.0
